<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="100%" height="100%">
  <defs>
    <!-- Warm Espresso & Terracotta Background Gradients -->
    <linearGradient id="warm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1513" />
      <stop offset="50%" stop-color="#251c18" />
      <stop offset="100%" stop-color="#2f221d" />
    </linearGradient>

    <linearGradient id="warm-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#31241f" stop-opacity="0.94" />
      <stop offset="100%" stop-color="#231916" stop-opacity="0.97" />
    </linearGradient>

    <linearGradient id="sunlit-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f2a65a" stop-opacity="1" />
      <stop offset="55%" stop-color="#e07a5f" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#f4d58d" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="warm-ribbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f2a65a" stop-opacity="0.08" />
      <stop offset="45%" stop-color="#e07a5f" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#f4d58d" stop-opacity="0.5" />
    </linearGradient>

    <!-- Soft Ambient Sun Glows -->
    <radialGradient id="amber-glow" cx="18%" cy="28%" r="50%">
      <stop offset="0%" stop-color="#f2a65a" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#1c1513" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="terracotta-glow" cx="82%" cy="72%" r="45%">
      <stop offset="0%" stop-color="#e07a5f" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#1c1513" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Warm Dot Matrix Pattern -->
    <pattern id="warm-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1" fill="#f4d58d" fill-opacity="0.09" />
    </pattern>
  </defs>

  <style>
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .serif {
      font-family: 'Georgia', 'Cambria', 'Times New Roman', serif;
    }
    .mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'Iosevka', Consolas, monospace;
    }
    .greeting {
      font-size: 13px;
      font-weight: 600;
      fill: #f2a65a;
      letter-spacing: 1.2px;
    }
    .title {
      font-size: 50px;
      font-weight: 800;
      fill: #fbf5ef;
      letter-spacing: -1px;
    }
    .handle {
      font-size: 19px;
      font-weight: 500;
      fill: #c9b5a7;
    }
    .motto {
      font-size: 17px;
      font-style: italic;
      fill: #f0e4d8;
    }
    .subtitle {
      font-size: 14.5px;
      font-weight: 400;
      fill: #d5c3b6;
    }
    .pill-text {
      font-size: 12.5px;
      font-weight: 600;
      fill: #f7ede4;
    }
    .card-title {
      font-size: 13px;
      font-weight: 700;
      fill: #f4d58d;
      letter-spacing: 0.6px;
    }
    .item-title {
      font-size: 13.5px;
      font-weight: 600;
      fill: #fbf5ef;
    }
    .item-desc {
      font-size: 12.5px;
      fill: #cbb7a8;
    }
    .footer-note {
      font-size: 12px;
      fill: #a89486;
    }
    @keyframes gentle-pulse {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 0.35; }
    }
    .sparkle {
      animation: gentle-pulse 2.4s ease-in-out infinite;
    }
  </style>

  <!-- Canvas & Warm Ambient Lighting -->
  <rect width="1280" height="360" rx="16" fill="url(#warm-bg)" />
  <rect width="1280" height="360" rx="16" fill="url(#amber-glow)" />
  <rect width="1280" height="360" rx="16" fill="url(#terracotta-glow)" />
  <rect width="1280" height="360" rx="16" fill="url(#warm-dots)" />

  <!-- Soft Flowing Horizon Curves -->
  <g opacity="0.75">
    <path d="M -20,310 C 240,265 460,335 740,270 C 980,215 1120,255 1300,195" fill="none" stroke="url(#warm-ribbon)" stroke-width="2.5" />
    <path d="M -20,332 C 280,295 520,345 810,290 C 1030,248 1160,275 1300,230" fill="none" stroke="url(#warm-ribbon)" stroke-width="1.25" stroke-dasharray="6 4" />
  </g>

  <!-- Outer Warm Border -->
  <rect x="1.5" y="1.5" width="1277" height="357" rx="15" fill="none" stroke="#46342c" stroke-width="1.5" />

  <!-- Left Column: Friendly Welcome, Identity & Philosophy -->
  <g transform="translate(60, 52)">
    <!-- Top Welcome Line -->
    <g transform="translate(0, 0)">
      <text x="0" y="0" class="sans greeting">☼ WELCOME TO MY CORNER OF GITHUB  ·  ZHEJIANG, CHINA</text>
      <!-- Warm Status Pill -->
      <g transform="translate(428, -15)">
        <rect x="0" y="0" width="188" height="22" rx="11" fill="#3a251e" stroke="#e07a5f" stroke-width="1" stroke-opacity="0.6" />
        <text x="14" y="15" class="mono" font-size="11.5" font-weight="600" fill="#f4a261">✦ Building & Sharing</text>
      </g>
    </g>

    <!-- Name & Handle -->
    <g transform="translate(0, 62)">
      <text x="0" y="0" class="sans title">Hi, I'm ZhangDM</text>
      <text x="398" y="-4" class="mono handle">@ZhangDM-520</text>
    </g>

    <!-- Warm Gradient Divider -->
    <rect x="0" y="80" width="600" height="2.5" rx="1.25" fill="url(#sunlit-accent)" />

    <!-- Bio Quote & Helpful Subtitle -->
    <g transform="translate(0, 114)">
      <rect x="0" y="-17" width="3.5" height="48" rx="1.75" fill="#f2a65a" />
      <text x="18" y="0" class="serif motto">
        “Our very existence is the ultimate defiance against the hatred”
      </text>
      <text x="18" y="25" class="sans subtitle">
        Crafting thoughtful, everyday tools, desktop comforts, and open-source helpers that anyone can pick up and use.
      </text>
    </g>

    <!-- Friendly Topic Badges -->
    <g transform="translate(0, 174)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="176" height="32" rx="16" fill="#2b1f1b" stroke="#523c33" stroke-width="1.2" />
      <text x="18" y="20" class="sans pill-text" fill="#f4d58d">✦ Helpful Utilities</text>

      <!-- Pill 2 -->
      <rect x="190" y="0" width="184" height="32" rx="16" fill="#2b1f1b" stroke="#523c33" stroke-width="1.2" />
      <text x="208" y="20" class="sans pill-text" fill="#f2a65a">◈ Desktop Comfort</text>

      <!-- Pill 3 -->
      <rect x="388" y="0" width="176" height="32" rx="16" fill="#2b1f1b" stroke="#523c33" stroke-width="1.2" />
      <text x="406" y="20" class="sans pill-text" fill="#e07a5f">❀ Document Tools</text>

      <!-- Pill 4 -->
      <rect x="578" y="0" width="142" height="32" rx="16" fill="#2b1f1b" stroke="#523c33" stroke-width="1.2" />
      <text x="596" y="20" class="sans pill-text" fill="#f0e4d8">▸ Open Source</text>
    </g>

    <!-- Bottom Warm Footnote -->
    <g transform="translate(0, 244)">
      <text x="0" y="0" class="mono footer-note">
        ❀ Always happy to collaborate, troubleshoot, or share notes  ·  github.com/ZhangDM-520
      </text>
    </g>
  </g>

  <!-- Right Column: Warm Notebook / Workshop Card -->
  <g transform="translate(815, 42)">
    <!-- Soft Drop Shadow & Card Frame -->
    <rect x="4" y="8" width="408" height="276" rx="14" fill="#120c0a" opacity="0.55" />
    <rect x="0" y="0" width="408" height="276" rx="14" fill="url(#warm-card)" stroke="#4d382f" stroke-width="1.3" />

    <!-- Card Header Bar -->
    <path d="M 0,14 Q 0,0 14,0 L 394,0 Q 408,0 408,14 L 408,40 L 0,40 Z" fill="#382822" />
    <line x1="0" y1="40" x2="408" y2="40" stroke="#4d382f" stroke-width="1" />

    <text x="20" y="25" class="sans card-title">✦ WHAT I ENJOY BUILDING & SHARING</text>
    <text x="372" y="25" class="mono card-title sparkle">☼</text>

    <!-- Friendly Project Highlights -->
    <g transform="translate(22, 68)">
      <!-- Item 1 -->
      <text x="0" y="0" class="mono" font-size="14" fill="#f2a65a">◈</text>
      <text x="22" y="0" class="sans item-title">Smoother Everyday Computing</text>
      <text x="22" y="19" class="sans item-desc">Keeping apps responsive & balanced automatically</text>

      <!-- Item 2 -->
      <text x="0" y="54" class="mono" font-size="14" fill="#e07a5f">◈</text>
      <text x="22" y="54" class="sans item-title">Thoughtful Screen & Display Care</text>
      <text x="22" y="73" class="sans item-desc">Smart idle locks & gentle ambient brightness</text>

      <!-- Item 3 -->
      <text x="0" y="108" class="mono" font-size="14" fill="#f4d58d">◈</text>
      <text x="22" y="108" class="sans item-title">Clean & Effortless Documents</text>
      <text x="22" y="127" class="sans item-desc">One-step PDF cleanup & typography helpers</text>

      <!-- Divider -->
      <line x1="0" y1="150" x2="364" y2="150" stroke="#46332b" stroke-width="1" />

      <!-- Warm Invitation Footer inside Card -->
      <text x="0" y="174" class="sans item-desc" fill="#f0e4d8">
        ▸ Feel free to explore my repos, open an issue,
      </text>
      <text x="14" y="193" class="sans item-desc" fill="#f0e4d8">
        or grab anything that makes your day easier!
      </text>
    </g>
  </g>
</svg>
