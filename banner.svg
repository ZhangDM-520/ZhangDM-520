<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="100%" height="100%">
  <defs>
    <!-- Trans Flag Palette, colour-picked from 233471005.jpg:
         flag blue #5bcefa (exact corner match), flag pink #f5a9b8, white #f8eff3,
         navy #26243c / #413857 / #534b6f, lilac #d7d3e2, slate #767fa9 -->
    <linearGradient id="flag-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8eff3" />
      <stop offset="55%" stop-color="#edf4fb" />
      <stop offset="100%" stop-color="#fbe9f0" />
    </linearGradient>

    <linearGradient id="flag-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.94" />
      <stop offset="100%" stop-color="#f1f2fa" stop-opacity="0.96" />
    </linearGradient>

    <linearGradient id="flag-stripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5bcefa" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5a9b8" />
    </linearGradient>

    <linearGradient id="flag-ribbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5bcefa" stop-opacity="0.10" />
      <stop offset="45%" stop-color="#5bcefa" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#f5a9b8" stop-opacity="0.45" />
    </linearGradient>

    <!-- Soft Ambient Flag Glows -->
    <radialGradient id="blue-glow" cx="18%" cy="28%" r="50%">
      <stop offset="0%" stop-color="#5bcefa" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#5bcefa" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="pink-glow" cx="82%" cy="72%" r="45%">
      <stop offset="0%" stop-color="#f5a9b8" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#f5a9b8" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Lilac Dot Matrix Pattern -->
    <pattern id="lilac-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1" fill="#767fa9" fill-opacity="0.12" />
    </pattern>
  </defs>

  <style>
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .serif {
      font-family: 'Georgia', 'Cambria', 'Times New Roman', serif;
    }
    .mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'Iosevka', Consolas, monospace;
    }
    .greeting {
      font-size: 13px;
      font-weight: 600;
      fill: #1f8fc7;
      letter-spacing: 1.2px;
    }
    .title {
      font-size: 50px;
      font-weight: 800;
      fill: #26243c;
      letter-spacing: -1px;
    }
    .handle {
      font-size: 19px;
      font-weight: 500;
      fill: #534b6f;
    }
    .motto {
      font-size: 17px;
      font-style: italic;
      fill: #413857;
    }
    .subtitle {
      font-size: 14.5px;
      font-weight: 400;
      fill: #534b6f;
    }
    .pill-text {
      font-size: 12.5px;
      font-weight: 600;
      fill: #26243c;
    }
    .card-title {
      font-size: 13px;
      font-weight: 700;
      fill: #c7578b;
      letter-spacing: 0.6px;
    }
    .item-title {
      font-size: 13.5px;
      font-weight: 600;
      fill: #26243c;
    }
    .item-desc {
      font-size: 12.5px;
      fill: #534b6f;
    }
    .footer-note {
      font-size: 12px;
      fill: #534b6f;
    }
    @keyframes gentle-pulse {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 0.35; }
    }
    .sparkle {
      animation: gentle-pulse 2.4s ease-in-out infinite;
    }
  </style>

  <!-- Canvas & Trans Flag Ambient Lighting -->
  <rect width="1280" height="360" rx="16" fill="url(#flag-bg)" />
  <rect width="1280" height="360" rx="16" fill="url(#blue-glow)" />
  <rect width="1280" height="360" rx="16" fill="url(#pink-glow)" />

  <!-- Image-motif Corner Shapes (mirrors 233471005.jpg composition) -->
  <path d="M -20,150 L 170,-20 L 285,-20 L -20,255 Z" fill="#f5a9b8" opacity="0.32" />
  <path d="M 1280,0 L 1280,175 L 1085,0 Z" fill="#5bcefa" opacity="0.45" />
  <ellipse cx="110" cy="392" rx="290" ry="155" fill="#a0c4e4" opacity="0.32" />
  <ellipse cx="1210" cy="345" rx="230" ry="130" fill="#eecddf" opacity="0.5" />

  <rect width="1280" height="360" rx="16" fill="url(#lilac-dots)" />

  <!-- Soft Flowing Flag Ribbon Curves -->
  <g opacity="0.75">
    <path d="M -20,310 C 240,265 460,335 740,270 C 980,215 1120,255 1300,195" fill="none" stroke="url(#flag-ribbon)" stroke-width="2.5" />
    <path d="M -20,332 C 280,295 520,345 810,290 C 1030,248 1160,275 1300,230" fill="none" stroke="url(#flag-ribbon)" stroke-width="1.25" stroke-dasharray="6 4" />
  </g>

  <!-- Outer Lilac Border -->
  <rect x="1.5" y="1.5" width="1277" height="357" rx="15" fill="none" stroke="#c9b7d6" stroke-width="1.5" />

  <!-- Left Column: Friendly Welcome, Identity & Philosophy -->
  <g transform="translate(32, 32)">
    <!-- Top Welcome Line -->
    <g transform="translate(0, 8)">
      <text x="0" y="0" class="sans greeting">☼ WELCOME TO MY CORNER OF GITHUB</text>
    </g>

    <!-- Name & Handle -->
    <g transform="translate(0, 76)">
      <text x="0" y="0" class="sans title">ZhangDM here!</text>
      <text x="380" y="-4" class="mono handle">@ZhangDM-520</text>
    </g>

    <!-- Trans Flag Gradient Divider -->
    <rect x="0" y="98" width="620" height="3" rx="1.5" fill="url(#flag-stripe)" />

    <!-- Bio Quote & Helpful Subtitle -->
    <g transform="translate(0, 136)">
      <rect x="0" y="-17" width="3.5" height="50" rx="1.75" fill="#f5a9b8" />
      <text x="18" y="0" class="serif motto">
        “Our very existence is the ultimate defiance against the hatred”
      </text>
      <text x="18" y="27" class="sans subtitle">
        Crafting thoughtful, everyday tools, desktop comforts, and open-source helpers that anyone can pick up and use.
      </text>
    </g>

    <!-- Friendly Topic Badges -->
    <g transform="translate(0, 204)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="180" height="34" rx="17" fill="#ffffff" fill-opacity="0.82" stroke="#d7d3e2" stroke-width="1.2" />
      <text x="18" y="22" class="sans pill-text" fill="#1f8fc7">✦ Helpful Utilities</text>

      <!-- Pill 2 -->
      <rect x="194" y="0" width="188" height="34" rx="17" fill="#ffffff" fill-opacity="0.82" stroke="#d7d3e2" stroke-width="1.2" />
      <text x="212" y="22" class="sans pill-text" fill="#c7578b">◈ Desktop Comfort</text>

      <!-- Pill 3 -->
      <rect x="396" y="0" width="180" height="34" rx="17" fill="#ffffff" fill-opacity="0.82" stroke="#d7d3e2" stroke-width="1.2" />
      <text x="414" y="22" class="sans pill-text" fill="#767fa9">❀ Document Tools</text>

      <!-- Pill 4 -->
      <rect x="590" y="0" width="146" height="34" rx="17" fill="#ffffff" fill-opacity="0.82" stroke="#d7d3e2" stroke-width="1.2" />
      <text x="608" y="22" class="sans pill-text" fill="#534b6f">▸ Open Source</text>
    </g>

    <!-- Bottom Footnote -->
    <g transform="translate(0, 292)">
      <text x="0" y="0" class="mono footer-note">
        ❀ Always happy to collaborate, troubleshoot, or share notes  ·  github.com/ZhangDM-520
      </text>
    </g>
  </g>

  <!-- Right Column: Notebook / Workshop Card -->
  <g transform="translate(804, 32)">
    <!-- Soft Drop Shadow & Card Frame -->
    <rect x="4" y="8" width="444" height="296" rx="14" fill="#26243c" opacity="0.16" />
    <rect x="0" y="0" width="444" height="296" rx="14" fill="url(#flag-card)" stroke="#d7d3e2" stroke-width="1.3" />

    <!-- Card Header Bar -->
    <path d="M 0,14 Q 0,0 14,0 L 430,0 Q 444,0 444,14 L 444,40 L 0,40 Z" fill="#efeaf6" />
    <line x1="0" y1="40" x2="444" y2="40" stroke="#d7d3e2" stroke-width="1" />

    <text x="20" y="25" class="sans card-title">✦ WHAT I ENJOY BUILDING · SHARING</text>
    <text x="412" y="25" class="mono card-title sparkle">☼</text>

    <!-- Friendly Project Highlights -->
    <g transform="translate(22, 68)">
      <!-- Item 1 -->
      <text x="0" y="0" class="mono" font-size="14" fill="#1f8fc7">◈</text>
      <text x="22" y="0" class="sans item-title">Smoother Everyday Computing</text>
      <text x="22" y="19" class="sans item-desc">Keeping apps responsive · balanced automatically</text>

      <!-- Item 2 -->
      <text x="0" y="54" class="mono" font-size="14" fill="#c7578b">◈</text>
      <text x="22" y="54" class="sans item-title">Thoughtful Screen · Display Care</text>
      <text x="22" y="73" class="sans item-desc">Smart idle locks · gentle ambient brightness</text>

      <!-- Item 3 -->
      <text x="0" y="108" class="mono" font-size="14" fill="#767fa9">◈</text>
      <text x="22" y="108" class="sans item-title">Clean · Effortless Documents</text>
      <text x="22" y="127" class="sans item-desc">One-step PDF cleanup · typography helpers</text>

      <!-- Divider -->
      <line x1="0" y1="150" x2="400" y2="150" stroke="#d7d3e2" stroke-width="1" />

      <!-- Invitation Footer inside Card -->
      <text x="0" y="174" class="sans item-desc" fill="#413857">
        ▸ Feel free to explore my repos, open an issue,
      </text>
      <text x="14" y="193" class="sans item-desc" fill="#413857">
        or grab anything that makes your day easier!
      </text>
    </g>
  </g>
</svg>
